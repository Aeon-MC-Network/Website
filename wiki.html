<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Wiki & Gameplay Guides - AeonMC Community Network</title>
  <meta name="description" content="Official AeonMC Wiki: Comprehensive guides for 8 custom jobs matrices, procedural dungeons, economy commands, land claiming, and player ranks.">
  <meta name="keywords" content="Minecraft, Wiki, AeonMC, Custom Jobs, Dungeons, Land Claiming, Economy">

  <!-- Open Graph / Social SEO -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aeonmc.com/wiki.html">
  <meta property="og:title" content="Official Wiki & Guides - AeonMC Network">
  <meta property="og:description" content="Explore documentation for custom jobs, procedural dungeons, economy commands, and claim protection.">
  <meta property="og:image" content="https://aeonmc.com/assets/img/og-banner.jpg">
  <meta property="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Production Compiled Tailwind CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col relative overflow-x-hidden">

  <header id="mainHeader" class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80"></header>

  <main class="flex-grow relative z-10 py-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <div class="text-center mb-10">
        <h1 class="text-3xl sm:text-4xl font-black text-white mb-2">AeonMC Official Wiki</h1>
        <p class="text-slate-400 text-xs sm:text-sm max-w-xl mx-auto">Master our survival mechanics, 8 calibrated job matrices, hand-crafted dungeon tactics, and economy commands.</p>
      </div>

      <!-- Wiki Search & Category Filter -->
      <div class="max-w-md mx-auto mb-8">
        <div class="relative">
          <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input type="text" id="wikiSearchInput" onkeyup="WikiPage.searchWiki()" placeholder="Search wiki articles & commands..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none">
        </div>
      </div>

      <!-- Wiki Grid -->
      <div id="wikiArticlesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <!-- Interactive Wiki Article Sub-Page Reader & Comment / Star-Rating Modal -->
  <div id="viewWikiModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="WikiPage.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
      <div id="viewWikiModalBody"></div>
    </div>
  </div>

  <footer id="mainFooter" class="border-t border-slate-800/80 py-8 relative z-10 bg-slate-950/60 backdrop-blur-sm"></footer>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const WikiPage = {
      init() {
        this.renderWiki();
      },

      renderWiki() {
        const grid = document.getElementById('wikiArticlesGrid');
        if (!grid) return;

        const wikiList = StorageDB.get(STORAGE_KEYS.WIKI) || [];

        grid.innerHTML = wikiList.map(w => {
          const avgRating = w.ratings && w.ratings.length > 0
            ? (w.ratings.reduce((a, b) => a + b, 0) / w.ratings.length).toFixed(1)
            : '5.0';

          return `
            <div onclick="WikiPage.openArticle('${w.id}')" class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-indigo-500/50 cursor-pointer transition-all space-y-3 group">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold uppercase px-2.5 py-0.5 rounded bg-indigo-950 text-indigo-400 border border-indigo-500/30">${w.category}</span>
                <div class="flex items-center gap-1 text-amber-400 text-xs font-bold">
                  <i class="fas fa-star text-[10px]"></i>
                  <span>${avgRating}</span>
                </div>
              </div>
              <h3 class="text-base font-bold text-white group-hover:text-indigo-400 transition-colors">${w.title}</h3>
              <p class="text-xs text-slate-400 leading-relaxed">${w.description}</p>
              <div class="pt-2 flex items-center justify-between text-xs text-slate-500 border-t border-slate-800/60">
                <span>By <strong>${w.author}</strong> • ${w.date}</span>
                <span class="text-indigo-400 font-semibold group-hover:translate-x-1 transition-transform inline-flex items-center gap-1">Read Guide <i class="fas fa-arrow-right text-[10px]"></i></span>
              </div>
            </div>
          `;
        }).join('');
      },

      searchWiki() {
        const q = document.getElementById('wikiSearchInput').value.toLowerCase();
        const wikiList = StorageDB.get(STORAGE_KEYS.WIKI) || [];
        const filtered = wikiList.filter(w => 
          w.title.toLowerCase().includes(q) || 
          w.category.toLowerCase().includes(q) || 
          w.description.toLowerCase().includes(q) || 
          w.content.toLowerCase().includes(q)
        );

        const grid = document.getElementById('wikiArticlesGrid');
        if (filtered.length === 0) {
          grid.innerHTML = `<div class="col-span-2 p-8 text-center text-slate-400 text-xs">No wiki articles found matching "${q}".</div>`;
          return;
        }

        grid.innerHTML = filtered.map(w => {
          const avgRating = w.ratings && w.ratings.length > 0
            ? (w.ratings.reduce((a, b) => a + b, 0) / w.ratings.length).toFixed(1)
            : '5.0';

          return `
            <div onclick="WikiPage.openArticle('${w.id}')" class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-indigo-500/50 cursor-pointer transition-all space-y-3 group">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold uppercase px-2.5 py-0.5 rounded bg-indigo-950 text-indigo-400 border border-indigo-500/30">${w.category}</span>
                <div class="flex items-center gap-1 text-amber-400 text-xs font-bold">
                  <i class="fas fa-star text-[10px]"></i>
                  <span>${avgRating}</span>
                </div>
              </div>
              <h3 class="text-base font-bold text-white group-hover:text-indigo-400 transition-colors">${w.title}</h3>
              <p class="text-xs text-slate-400 leading-relaxed">${w.description}</p>
            </div>
          `;
        }).join('');
      },

      openArticle(id) {
        const wikiList = StorageDB.get(STORAGE_KEYS.WIKI) || [];
        const article = wikiList.find(w => w.id === id);
        if (!article) return;

        const currentUser = Auth.getCurrentUser();
        const isStaff = Auth.isStaff();
        const isAuthor = currentUser && currentUser.username.toLowerCase() === article.author.toLowerCase();
        const canDelete = isStaff || isAuthor;

        const avgRating = article.ratings && article.ratings.length > 0
          ? (article.ratings.reduce((a, b) => a + b, 0) / article.ratings.length).toFixed(1)
          : '5.0';

        const commentsHTML = (article.comments || []).map(c => `
          <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1 text-xs">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <strong class="text-white">${c.author}</strong>
                <div class="flex items-center gap-0.5 text-amber-400 text-[10px]">
                  ${Array.from({length: c.rating}, () => '<i class="fas fa-star"></i>').join('')}
                </div>
              </div>
              <span class="text-slate-500 text-[10px]">${c.date}</span>
            </div>
            <p class="text-slate-300 text-xs leading-relaxed">${c.text}</p>
          </div>
        `).join('');

        const addCommentForm = currentUser ? `
          <form onsubmit="WikiPage.submitComment(event, '${article.id}')" class="space-y-3 border-t border-slate-800 pt-4 mt-6">
            <h4 class="text-xs font-bold text-white uppercase tracking-wider">Leave a Rating & Review</h4>
            <div class="flex items-center gap-3">
              <label class="text-xs text-slate-400 font-semibold">Your Rating:</label>
              <select id="userRatingSelect" class="px-3 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-white text-xs">
                <option value="5">⭐⭐⭐⭐⭐ (5 / 5)</option>
                <option value="4">⭐⭐⭐⭐ (4 / 5)</option>
                <option value="3">⭐⭐⭐ (3 / 5)</option>
                <option value="2">⭐⭐ (2 / 5)</option>
                <option value="1">⭐ (1 / 5)</option>
              </select>
            </div>
            <textarea id="userCommentText" rows="3" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" placeholder="Write your review or tips..." required></textarea>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">Submit Rating & Comment</button>
          </form>
        ` : `
          <div class="border-t border-slate-800 pt-4 mt-6 text-center text-xs text-slate-400">
            Please <button onclick="App.openLoginModal()" class="text-indigo-400 font-bold hover:underline">Log In</button> to leave a rating or comment.
          </div>
        `;

        const modalBody = document.getElementById('viewWikiModalBody');
        modalBody.innerHTML = `
          <div class="mb-4 flex items-start justify-between gap-4">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-400 px-2 py-0.5 rounded bg-indigo-950 border border-indigo-500/30">${article.category}</span>
              <h2 class="text-xl font-bold text-white mt-2">${article.title}</h2>
              <div class="flex items-center gap-3 text-xs text-slate-400 mt-1">
                <span>By ${article.author} • ${article.date}</span>
                <span class="text-amber-400 font-bold flex items-center gap-1"><i class="fas fa-star text-[10px]"></i> ${avgRating} / 5 (${article.ratings ? article.ratings.length : 0} ratings)</span>
              </div>
            </div>

            <!-- Requirement 3: Add Delete Control for Author or Staff/Admin -->
            ${canDelete ? `
              <button onclick="WikiPage.deleteArticle('${article.id}')" class="px-3.5 py-1.5 rounded-xl bg-rose-600/20 border border-rose-500/30 hover:bg-rose-600 text-rose-300 hover:text-white text-xs font-bold transition-all flex items-center gap-1.5 shrink-0">
                <i class="fas fa-trash-alt"></i>
                <span>Delete Guide</span>
              </button>
            ` : ''}
          </div>

          <div class="prose prose-invert max-w-none text-slate-300 text-xs sm:text-sm leading-relaxed whitespace-pre-line bg-slate-950 p-5 rounded-2xl border border-slate-800 mb-6">
            ${article.content}
          </div>

          <!-- Rating & Comment Section -->
          <div class="space-y-4">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
              <i class="fas fa-comments text-indigo-400"></i>
              <span>Community Reviews & Comments (${article.comments ? article.comments.length : 0})</span>
            </h3>
            
            <div class="space-y-2 max-h-48 overflow-y-auto">
              ${commentsHTML || '<div class="text-xs text-slate-500">No reviews yet. Be the first to leave feedback!</div>'}
            </div>

            ${addCommentForm}
          </div>
        `;

        document.getElementById('viewWikiModal').classList.remove('hidden');
        document.getElementById('viewWikiModal').classList.add('flex');
      },

      deleteArticle(id) {
        const currentUser = Auth.getCurrentUser();
        const isStaff = Auth.isStaff();
        const wikiList = StorageDB.get(STORAGE_KEYS.WIKI) || [];
        const article = wikiList.find(w => w.id === id);
        if (!article) return;

        const isAuthor = currentUser && currentUser.username.toLowerCase() === article.author.toLowerCase();
        if (!isStaff && !isAuthor) {
          App.showToast('Unauthorized to delete this wiki guide.', 'error');
          return;
        }

        if (!confirm('Delete this wiki article permanently?')) return;
        const newWiki = wikiList.filter(w => w.id !== id);
        StorageDB.set(STORAGE_KEYS.WIKI, newWiki);
        this.closeModal();
        this.renderWiki();
        App.showToast('Wiki guide deleted.', 'info');
      },

      submitComment(e, articleId) {
        e.preventDefault();
        const user = Auth.getCurrentUser();
        if (!user) return;

        const rating = parseInt(document.getElementById('userRatingSelect').value);
        const text = document.getElementById('userCommentText').value.trim();

        const wikiList = StorageDB.get(STORAGE_KEYS.WIKI) || [];
        const article = wikiList.find(w => w.id === articleId);

        if (article) {
          if (!article.ratings) article.ratings = [];
          if (!article.comments) article.comments = [];

          article.ratings.push(rating);
          article.comments.unshift({
            id: "wc-" + Date.now(),
            author: user.username,
            date: new Date().toLocaleDateString(),
            rating: rating,
            text: text
          });

          StorageDB.set(STORAGE_KEYS.WIKI, wikiList);
          StorageDB.logAction(user.username, "Rate Wiki Article", `Rated ${article.title} ${rating} stars`);

          this.openArticle(articleId);
          this.renderWiki();
          App.showToast('Rating and comment submitted!', 'success');
        }
      },

      closeModal() {
        const modal = document.getElementById('viewWikiModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    };

    document.addEventListener('DOMContentLoaded', () => WikiPage.init());
  </script>
</body>
</html>
