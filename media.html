<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media & Content Creator Hub - AeonMC Network</title>
  <meta name="description" content="Explore community media, YouTube videos, Twitch streams, and content showcases on AeonMC.">
  <meta name="keywords" content="Minecraft, Media, AeonMC, YouTube, Twitch, Creator Hub">

  <!-- Open Graph / Social SEO -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aeonmc.com/media.html">
  <meta property="og:title" content="Media & Content Creator Hub - AeonMC Network">
  <meta property="og:description" content="Community screenshots, creator videos, and gameplay showcases.">
  <meta property="og:image" content="https://aeonmc.com/assets/img/og-banner.jpg">
  <meta property="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Production Compiled Tailwind CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col relative overflow-x-hidden">

  <header id="mainHeader" class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80"></header>

  <main class="flex-grow relative z-10 py-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-3xl font-black text-white">Media & Creator Showcase</h1>
          <p class="text-slate-400 text-xs sm:text-sm mt-1">Community screenshots, creator videos, and gameplay showcases.</p>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="MediaPage.openAddMediaModal()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg transition-all flex items-center gap-2">
            <i class="fas fa-plus"></i> Add Media Item
          </button>
          
          <a href="contact.html#applications" class="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs shadow-lg shadow-purple-600/20 transition-all flex items-center gap-2">
            <i class="fas fa-star"></i> Apply for Creator Rank
          </a>
        </div>
      </div>

      <!-- Media Items Grid -->
      <div id="mediaGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
        <!-- Dynamic media cards -->
      </div>

    </div>
  </main>

  <!-- Add Media Modal -->
  <div id="addMediaModal" role="dialog" aria-modal="true" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="MediaPage.closeModal('addMediaModal')" aria-label="Close Modal" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
      <h3 class="text-lg font-bold text-white mb-4"><i class="fas fa-image text-purple-400 mr-2"></i> Submit Media Showcase</h3>
      
      <form onsubmit="MediaPage.saveMedia(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Title</label>
          <input type="text" id="mediaTitleInput" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Image or Thumbnail URL</label>
          <input type="url" id="mediaUrlInput" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs" placeholder="https://..." required>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs">Publish Media Item</button>
      </form>
    </div>
  </div>

  <footer id="mainFooter" class="border-t border-slate-800/80 py-8 relative z-10 bg-slate-950/60 backdrop-blur-sm"></footer>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const MediaPage = {
      init() {
        this.renderMedia();
      },

      renderMedia() {
        const grid = document.getElementById('mediaGrid');
        if (!grid) return;

        const mediaItems = StorageDB.get(STORAGE_KEYS.MEDIA) || [];
        const currentUser = Auth.getCurrentUser();
        const isStaff = Auth.isStaff();

        grid.innerHTML = mediaItems.map(m => {
          const isAuthor = currentUser && currentUser.username.toLowerCase() === m.author.toLowerCase();
          const canDelete = isStaff || isAuthor;

          return `
            <div class="rounded-2xl bg-slate-900/60 border border-slate-800 overflow-hidden group hover:border-purple-500/40 transition-all flex flex-col justify-between">
              <div class="relative aspect-video overflow-hidden">
                <img src="${m.url}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent flex flex-col justify-end p-4">
                  <h4 class="text-sm font-bold text-white">${m.title}</h4>
                  <p class="text-[11px] text-purple-300 font-semibold">By ${m.author}</p>
                </div>
              </div>
              
              ${canDelete ? `
                <div class="p-3 bg-slate-950/80 border-t border-slate-800/80 flex justify-end">
                  <button onclick="MediaPage.deleteMedia('${m.id}')" class="px-3 py-1 rounded-lg bg-rose-600/20 border border-rose-500/30 hover:bg-rose-600 text-rose-300 hover:text-white font-bold text-[11px] transition-all flex items-center gap-1">
                    <i class="fas fa-trash-alt"></i>
                    <span>Delete Item</span>
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      },

      openAddMediaModal() {
        if (!Auth.isLoggedIn()) {
          App.showToast('Please log in to submit media.', 'error');
          App.openLoginModal();
          return;
        }
        document.getElementById('addMediaModal').classList.remove('hidden');
        document.getElementById('addMediaModal').classList.add('flex');
      },

      closeModal(id) {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('flex');
      },

      saveMedia(e) {
        e.preventDefault();
        if (!Auth.isLoggedIn()) return;

        const title = document.getElementById('mediaTitleInput').value.trim();
        const url = document.getElementById('mediaUrlInput').value.trim();

        const user = Auth.getCurrentUser();
        const mediaItems = StorageDB.get(STORAGE_KEYS.MEDIA) || [];

        mediaItems.unshift({
          id: "m-" + Date.now(),
          title: title,
          author: user.username,
          url: url
        });

        StorageDB.set(STORAGE_KEYS.MEDIA, mediaItems);
        StorageDB.logAction(user.username, "Add Media", `Published media item: ${title}`);

        this.closeModal('addMediaModal');
        this.renderMedia();
        App.showToast('Media item published!', 'success');
      },

      deleteMedia(id) {
        const currentUser = Auth.getCurrentUser();
        const isStaff = Auth.isStaff();
        const mediaItems = StorageDB.get(STORAGE_KEYS.MEDIA) || [];
        const media = mediaItems.find(m => m.id === id);
        if (!media) return;

        const isAuthor = currentUser && currentUser.username.toLowerCase() === media.author.toLowerCase();
        if (!isStaff && !isAuthor) {
          App.showToast('Unauthorized to delete this media item.', 'error');
          return;
        }

        if (!confirm('Delete this media item?')) return;
        const newMedia = mediaItems.filter(m => m.id !== id);
        StorageDB.set(STORAGE_KEYS.MEDIA, newMedia);
        this.renderMedia();
        App.showToast('Media item deleted.', 'info');
      }
    };

    document.addEventListener('DOMContentLoaded', () => MediaPage.init());
  </script>
</body>
</html>
