<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media & Content Creator Hub - AeonMC Network</title>
  <meta name="description" content="Explore community media, YouTube videos, Twitch streams, and content showcases on AeonMC.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Production Compiled Tailwind CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col relative overflow-x-hidden">

  <header id="mainHeader" class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80"></header>

  <main class="flex-grow relative z-10 py-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-3xl font-black text-white">Media & Creator Showcase</h1>
          <p class="text-slate-400 text-xs sm:text-sm mt-1">Community screenshots, creator videos, and gameplay showcases.</p>
        </div>
        <a href="contact.html#applications" class="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs shadow-lg shadow-purple-600/20 transition-all flex items-center gap-2 self-start md:self-auto">
          <i class="fas fa-star"></i> Apply for Creator Rank on Contact Page
        </a>
      </div>

      <!-- Media Items Grid -->
      <div id="mediaGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
        <!-- Dynamic media cards -->
      </div>

    </div>
  </main>

  <footer id="mainFooter" class="border-t border-slate-800/80 py-8 relative z-10 bg-slate-950/60 backdrop-blur-sm"></footer>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const MediaPage = {
      init() {
        this.renderMedia();
      },

      renderMedia() {
        const grid = document.getElementById('mediaGrid');
        if (!grid) return;

        const mediaItems = StorageDB.get(STORAGE_KEYS.MEDIA) || [];

        grid.innerHTML = mediaItems.map(m => `
          <div class="rounded-2xl bg-slate-900/60 border border-slate-800 overflow-hidden group hover:border-purple-500/40 transition-all">
            <div class="relative aspect-video overflow-hidden">
              <img src="${m.url}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent flex flex-col justify-end p-4">
                <h4 class="text-sm font-bold text-white">${m.title}</h4>
                <p class="text-[11px] text-purple-300 font-semibold">By ${m.author}</p>
              </div>
            </div>
          </div>
        `).join('');
      }
    };

    document.addEventListener('DOMContentLoaded', () => MediaPage.init());
  </script>
</body>
</html>
