<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network News & Patch Notes - AeonMC Community Network</title>
  <meta name="description" content="Stay updated with official patch notes, event announcements, and major network releases for AeonMC.">
  <meta name="keywords" content="Minecraft, Patch Notes, AeonMC, Server News, Community Updates">

  <!-- Open Graph / Social SEO -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aeonmc.com/news.html">
  <meta property="og:title" content="Network News & Patch Notes - AeonMC Network">
  <meta property="og:description" content="Official announcements, balance updates, and event notifications.">
  <meta property="og:image" content="https://aeonmc.com/assets/img/og-banner.jpg">
  <meta property="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Production Compiled Tailwind CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col relative overflow-x-hidden">

  <header id="mainHeader" class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80"></header>

  <main class="flex-grow relative z-10 py-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Page Title -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-3xl font-black text-white">Network News & Patch Notes</h1>
          <p class="text-slate-400 text-xs sm:text-sm mt-1">Official announcements, balance updates, and event notifications.</p>
        </div>
        <div id="staffNewsActions" class="hidden">
          <button onclick="NewsPage.openCreateModal()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2">
            <i class="fas fa-plus"></i> Post News Article
          </button>
        </div>
      </div>

      <!-- Articles Grid -->
      <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Dynamic news cards -->
      </div>

    </div>
  </main>

  <!-- View Article Modal -->
  <div id="viewNewsModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="NewsPage.closeModal('viewNewsModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
      <div id="viewNewsModalBody"></div>
    </div>
  </div>

  <!-- Create Article Modal -->
  <div id="createNewsModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <button onclick="NewsPage.closeModal('createNewsModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
      <h3 class="text-lg font-bold text-white mb-4">Post News Article</h3>
      
      <form onsubmit="NewsPage.saveNewsArticle(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Article Title</label>
          <input type="text" id="newsTitleInput" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tag</label>
          <select id="newsTagInput" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" required>
            <option value="Season Release">Season Release</option>
            <option value="Events">Events</option>
            <option value="Patch Notes">Patch Notes</option>
            <option value="Community">Community</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Image URL</label>
          <input type="text" id="newsImageInput" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" placeholder="https://..." required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Excerpt</label>
          <input type="text" id="newsExcerptInput" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Full Content</label>
          <textarea id="newsContentInput" rows="4" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" required></textarea>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs tracking-wide">Publish Article</button>
      </form>
    </div>
  </div>

  <footer id="mainFooter" class="border-t border-slate-800/80 py-8 relative z-10 bg-slate-950/60 backdrop-blur-sm"></footer>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const NewsPage = {
      init() {
        if (Auth.isStaff()) {
          const btn = document.getElementById('staffNewsActions');
          if (btn) btn.classList.remove('hidden');
        }
        this.renderNews();
      },

      renderNews() {
        const grid = document.getElementById('newsGrid');
        if (!grid) return;

        const newsList = StorageDB.get(STORAGE_KEYS.NEWS) || [];

        grid.innerHTML = newsList.map(n => `
          <div class="rounded-2xl bg-slate-900/60 border border-slate-800 overflow-hidden flex flex-col group hover:border-indigo-500/40 transition-all">
            <img src="${n.image}" alt="${n.title}" class="w-full h-44 object-cover">
            <div class="p-5 flex flex-col flex-grow">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-indigo-950/80 text-indigo-400 border border-indigo-500/30">${n.tag}</span>
                <span class="text-xs text-slate-500">• ${n.date}</span>
              </div>
              <h3 class="text-base font-bold text-white mb-2 leading-snug group-hover:text-indigo-400 transition-colors">${n.title}</h3>
              <p class="text-xs text-slate-400 leading-relaxed mb-4 flex-grow">${n.excerpt}</p>
              <button onclick="NewsPage.viewArticle('${n.id}')" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-indigo-600 text-white font-semibold text-xs transition-colors flex items-center justify-center gap-2">
                <span>Read Full Article</span>
                <i class="fas fa-arrow-right text-[10px]"></i>
              </button>
            </div>
          </div>
        `).join('');
      },

      viewArticle(id) {
        const newsList = StorageDB.get(STORAGE_KEYS.NEWS) || [];
        const article = newsList.find(n => n.id === id);
        if (!article) return;

        const modalBody = document.getElementById('viewNewsModalBody');
        modalBody.innerHTML = `
          <img src="${article.image}" alt="${article.title}" class="w-full h-56 object-cover rounded-xl mb-4 border border-slate-800">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-indigo-950/80 text-indigo-400 border border-indigo-500/30">${article.tag}</span>
            <span class="text-xs text-slate-400">By ${article.author} • ${article.date}</span>
          </div>
          <h2 class="text-xl font-bold text-white mb-4">${article.title}</h2>
          <p class="text-slate-300 text-xs sm:text-sm leading-relaxed whitespace-pre-line">${article.content}</p>
        `;

        document.getElementById('viewNewsModal').classList.remove('hidden');
        document.getElementById('viewNewsModal').classList.add('flex');
      },

      openCreateModal() {
        if (!Auth.isStaff()) return;
        document.getElementById('createNewsModal').classList.remove('hidden');
        document.getElementById('createNewsModal').classList.add('flex');
      },

      closeModal(id) {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('flex');
      },

      saveNewsArticle(e) {
        e.preventDefault();
        if (!Auth.isStaff()) return;

        const title = document.getElementById('newsTitleInput').value.trim();
        const tag = document.getElementById('newsTagInput').value;
        const image = document.getElementById('newsImageInput').value.trim();
        const excerpt = document.getElementById('newsExcerptInput').value.trim();
        const content = document.getElementById('newsContentInput').value.trim();

        const user = Auth.getCurrentUser();
        const newsList = StorageDB.get(STORAGE_KEYS.NEWS) || [];

        newsList.unshift({
          id: "news-" + Date.now(),
          title: title,
          tag: tag,
          author: user.username,
          date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
          excerpt: excerpt,
          content: content,
          image: image
        });

        StorageDB.set(STORAGE_KEYS.NEWS, newsList);
        StorageDB.logAction(user.username, "Publish News Article", `Published: ${title}`);

        this.closeModal('createNewsModal');
        this.renderNews();
        App.showToast('News article published!', 'success');
      }
    };

    document.addEventListener('DOMContentLoaded', () => NewsPage.init());
  </script>
</body>
</html>
