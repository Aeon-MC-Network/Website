<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Forums & Confidential Support Desk - AeonMC Network</title>
  <meta name="description" content="Official AeonMC Community Forums. Discuss strategies, read official news, submit private support tickets, and showcase creator content.">
  <meta name="keywords" content="Minecraft, Forums, Support Desk, AeonMC, Ban Appeals, Community">

  <!-- Open Graph / Social SEO -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aeonmc.com/forums.html">
  <meta property="og:title" content="Community Forums & Support Desk - AeonMC Network">
  <meta property="og:description" content="Engage with the community, view network updates, and lodge confidential support tickets.">
  <meta property="og:image" content="https://aeonmc.com/assets/img/og-banner.jpg">
  <meta property="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Production Compiled Tailwind CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col relative overflow-x-hidden">

  <header id="mainHeader" class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80"></header>

  <main class="flex-grow relative z-10 py-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Page Header -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-3xl font-black text-white">AeonMC Forums & Support Desk</h1>
          <p class="text-slate-400 text-xs sm:text-sm mt-1">Engage with the community, view network updates, and lodge confidential support tickets.</p>
        </div>
        
        <!-- Requirement 2: Restrict New Thread button action to logged in users -->
        <button onclick="ForumsPage.openNewThreadModal()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2 self-start md:self-auto">
          <i class="fas fa-plus"></i> New Thread
        </button>
      </div>

      <!-- Categories & Threads Container -->
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar Categories -->
        <div class="lg:col-span-1 space-y-2">
          <div class="p-3 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-1">
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 px-3 py-1">Categories</div>
            
            <button onclick="ForumsPage.filterCategory('all', this)" class="forum-cat-btn w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-between">
              <span><i class="fas fa-layer-group text-indigo-400 mr-2"></i> All Board Threads</span>
            </button>

            <button onclick="ForumsPage.filterCategory('General Discussion', this)" class="forum-cat-btn w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors flex items-center justify-between">
              <span><i class="fas fa-comments text-indigo-400 mr-2"></i> General Discussion</span>
            </button>

            <button onclick="ForumsPage.filterCategory('News & Announcements', this)" class="forum-cat-btn w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors flex items-center justify-between">
              <span><i class="fas fa-bullhorn text-indigo-400 mr-2"></i> News & Updates</span>
            </button>

            <button onclick="ForumsPage.filterCategory('Support & Ban Appeals', this)" class="forum-cat-btn w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors flex items-center justify-between">
              <span><i class="fas fa-lock text-rose-400 mr-2"></i> Support & Appeals (Private)</span>
            </button>

            <button onclick="ForumsPage.filterCategory('Content Creator Hub', this)" class="forum-cat-btn w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors flex items-center justify-between">
              <span><i class="fas fa-video text-purple-400 mr-2"></i> Creator Hub</span>
            </button>
          </div>
        </div>

        <!-- Threads Feed -->
        <div class="lg:col-span-3">
          <div id="forumThreadsList" class="space-y-3">
            <!-- Dynamically rendered -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Create Thread Modal -->
  <div id="createThreadModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <button onclick="ForumsPage.closeModal('createThreadModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
      <h3 class="text-lg font-bold text-white mb-4"><i class="fas fa-pen text-indigo-400 mr-2"></i> Create Forum Thread</h3>
      
      <form onsubmit="ForumsPage.saveNewThread(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Target Category</label>
          <select id="threadCategorySelect" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" required>
            <option value="General Discussion">General Discussion (Public)</option>
            <option value="Support & Ban Appeals">Support & Ban Appeals (Private / Staff Only)</option>
            <option value="Content Creator Hub">Content Creator Hub (Creators & Staff)</option>
            <option value="News & Announcements">News & Announcements (Staff Only)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Thread Title</label>
          <input type="text" id="threadTitleInput" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" placeholder="Title of your discussion..." required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Post Content</label>
          <textarea id="threadContentInput" rows="5" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" placeholder="Write your post content..." required></textarea>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs tracking-wide transition-colors">Publish Thread</button>
      </form>
    </div>
  </div>

  <!-- View Thread Modal -->
  <div id="viewThreadModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="ForumsPage.closeModal('viewThreadModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
      <div id="viewThreadModalBody"></div>
    </div>
  </div>

  <footer id="mainFooter" class="border-t border-slate-800/80 py-8 relative z-10 bg-slate-950/60 backdrop-blur-sm"></footer>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const ForumsPage = {
      activeCategory: 'all',

      init() {
        this.renderThreads();
      },

      filterCategory(cat, btnEl) {
        this.activeCategory = cat;
        document.querySelectorAll('.forum-cat-btn').forEach(b => {
          b.className = "forum-cat-btn w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors flex items-center justify-between";
        });
        if (btnEl) btnEl.className = "forum-cat-btn w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-between";
        this.renderThreads();
      },

      renderThreads() {
        const container = document.getElementById('forumThreadsList');
        if (!container) return;

        const threads = StorageDB.get(STORAGE_KEYS.FORUMS) || [];
        const currentUser = Auth.getCurrentUser();
        const isStaff = Auth.isStaff();

        let filtered = threads;

        if (this.activeCategory !== 'all') {
          filtered = threads.filter(t => t.category === this.activeCategory);
        }

        filtered = filtered.filter(t => {
          if (t.isPrivate || t.category === 'Support & Ban Appeals') {
            if (!currentUser) return false;
            if (isStaff) return true;
            return t.author.toLowerCase() === currentUser.username.toLowerCase();
          }
          return true;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="p-8 rounded-2xl bg-slate-900/40 border border-slate-800 text-center text-slate-400 text-xs">No threads found in this board.</div>`;
          return;
        }

        container.innerHTML = filtered.map(t => {
          const roleBadgeClasses = {
            'Admin': 'bg-rose-950/80 border-rose-500/50 text-rose-400',
            'Mod': 'bg-amber-950/80 border-amber-500/50 text-amber-400',
            'Content Creator': 'bg-purple-950/80 border-purple-500/50 text-purple-400',
            'Player': 'bg-indigo-950/80 border-indigo-500/50 text-indigo-400'
          };
          const badgeClass = roleBadgeClasses[t.authorRole] || 'bg-slate-800 text-slate-300';

          return `
            <div onclick="ForumsPage.viewThread('${t.id}')" class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-indigo-500/40 cursor-pointer transition-all flex items-center justify-between gap-4 group">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-indigo-400 shrink-0">
                  ${t.author.charAt(0).toUpperCase()}
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    ${t.isSticky ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">STICKY</span>' : ''}
                    ${t.isPrivate ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30"><i class="fas fa-lock text-[9px] mr-1"></i> PRIVATE TICKET</span>' : ''}
                    <h4 class="text-sm font-bold text-white group-hover:text-indigo-400 transition-colors">${t.title}</h4>
                  </div>
                  <div class="text-xs text-slate-400 mt-1 flex items-center gap-2">
                    <span>By <strong>${t.author}</strong></span>
                    <span class="text-[10px] uppercase font-bold px-1.5 py-0.2 rounded border ${badgeClass}">${t.authorRole}</span>
                    <span>• ${t.date}</span>
                    <span class="text-slate-500">(${t.category})</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-4 text-xs text-slate-400 shrink-0">
                <span><i class="far fa-eye mr-1"></i> ${t.views || 0}</span>
                <span><i class="far fa-comments mr-1"></i> ${t.replies ? t.replies.length : 0}</span>
              </div>
            </div>
          `;
        }).join('');
      },

      /* Requirement 2: Restrict Forum Posting to Logged-In Users */
      openNewThreadModal() {
        if (!Auth.isLoggedIn()) {
          App.showToast('Please log in to post a new thread.', 'error');
          App.openLoginModal();
          return;
        }
        document.getElementById('createThreadModal').classList.remove('hidden');
        document.getElementById('createThreadModal').classList.add('flex');
      },

      closeModal(id) {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('flex');
      },

      saveNewThread(e) {
        e.preventDefault();
        if (!Auth.isLoggedIn()) {
          App.showToast('Please log in to create a thread.', 'error');
          App.openLoginModal();
          return;
        }

        const category = document.getElementById('threadCategorySelect').value;
        const title = document.getElementById('threadTitleInput').value.trim();
        const content = document.getElementById('threadContentInput').value.trim();

        const user = Auth.getCurrentUser();

        if (category === 'News & Announcements' && !Auth.isStaff()) {
          App.showToast('Only Staff/Admins can post in News & Announcements.', 'error');
          return;
        }

        if (category === 'Content Creator Hub' && !Auth.isCreator()) {
          App.showToast('Content Creator or Staff rank required to post in Creator Hub.', 'error');
          return;
        }

        const isPrivate = (category === 'Support & Ban Appeals');

        const threads = StorageDB.get(STORAGE_KEYS.FORUMS) || [];
        const newThread = {
          id: "thread-" + Date.now(),
          category: category,
          title: title,
          author: user.username,
          authorRole: user.role,
          date: new Date().toISOString().split('T')[0],
          views: 1,
          isSticky: false,
          isLocked: false,
          isPrivate: isPrivate,
          replies: [
            {
              id: "rep-" + Date.now(),
              author: user.username,
              authorRole: user.role,
              date: new Date().toISOString().split('T')[0],
              content: content
            }
          ]
        };

        threads.unshift(newThread);
        StorageDB.set(STORAGE_KEYS.FORUMS, threads);
        StorageDB.logAction(user.username, "Create Forum Thread", `Posted in ${category}: ${title}`);

        this.closeModal('createThreadModal');
        this.renderThreads();
        App.showToast('Forum thread published successfully!', 'success');
      },

      viewThread(threadId) {
        const threads = StorageDB.get(STORAGE_KEYS.FORUMS) || [];
        const thread = threads.find(t => t.id === threadId);
        if (!thread) return;

        thread.views = (thread.views || 0) + 1;
        StorageDB.set(STORAGE_KEYS.FORUMS, threads);

        const modalBody = document.getElementById('viewThreadModalBody');
        const currentUser = Auth.getCurrentUser();
        const isStaff = Auth.isStaff();
        const isAuthor = currentUser && currentUser.username.toLowerCase() === thread.author.toLowerCase();

        const repliesHTML = thread.replies.map(r => {
          const isReplyAuthor = currentUser && currentUser.username.toLowerCase() === r.author.toLowerCase();
          const canDeleteReply = isStaff || isReplyAuthor;

          return `
            <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2 relative group">
              <div class="flex items-center justify-between text-xs">
                <div class="flex items-center gap-2">
                  <strong class="text-white">${r.author}</strong>
                  <span class="text-[10px] font-bold px-1.5 py-0.2 rounded border bg-slate-800 text-indigo-400">${r.authorRole}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-slate-500">${r.date}</span>
                  ${canDeleteReply ? `
                    <button onclick="ForumsPage.deleteReply('${thread.id}', '${r.id}')" class="text-rose-400 hover:text-rose-300 text-[10px] font-bold px-1.5 py-0.5 rounded bg-rose-950/60 border border-rose-500/30">
                      <i class="fas fa-trash-alt mr-1"></i> Delete
                    </button>
                  ` : ''}
                </div>
              </div>
              <p class="text-slate-300 text-xs leading-relaxed whitespace-pre-line">${r.content}</p>
            </div>
          `;
        }).join('');

        // Requirement 3: Add Delete Control for Thread Author or Staff/Admin
        const threadControls = `
          <div class="flex items-center justify-between gap-2 mb-4 border-b border-slate-800 pb-3">
            <div class="flex gap-2">
              ${isStaff ? `
                <button onclick="ForumsPage.toggleSticky('${thread.id}')" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">
                  ${thread.isSticky ? 'Unsticky' : 'Sticky Thread'}
                </button>
                <button onclick="ForumsPage.toggleLock('${thread.id}')" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">
                  ${thread.isLocked ? 'Unlock' : 'Lock Thread'}
                </button>
              ` : ''}
            </div>

            ${(isStaff || isAuthor) ? `
              <button onclick="ForumsPage.deleteThread('${thread.id}')" class="px-3.5 py-1.5 rounded-xl bg-rose-600/20 border border-rose-500/30 hover:bg-rose-600 text-rose-300 hover:text-white text-xs font-bold transition-all flex items-center gap-1.5">
                <i class="fas fa-trash-alt"></i>
                <span>Delete Thread</span>
              </button>
            ` : ''}
          </div>
        `;

        // Requirement 2: Restrict replies to authenticated users
        const replyForm = Auth.isLoggedIn() ? (!thread.isLocked ? `
          <form onsubmit="ForumsPage.saveReply(event, '${thread.id}')" class="mt-4 space-y-2">
            <textarea id="replyInput" rows="3" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:border-indigo-500 focus:outline-none" placeholder="Write your reply..." required></textarea>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">Post Reply</button>
          </form>
        ` : `<div class="mt-4 text-xs text-amber-400 font-semibold bg-amber-950/40 p-3 rounded-xl border border-amber-500/30"><i class="fas fa-lock mr-2"></i> This thread has been locked by staff.</div>`) : `
          <div class="mt-4 p-4 rounded-xl bg-slate-950 border border-slate-800 text-center text-xs text-slate-400">
            Please <button onclick="App.openLoginModal()" class="text-indigo-400 font-bold hover:underline">Log In</button> to post a reply to this thread.
          </div>
        `;

        modalBody.innerHTML = `
          <div class="mb-4">
            <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-400">${thread.category}</span>
            <h2 class="text-xl font-bold text-white mt-1">${thread.title}</h2>
          </div>
          ${threadControls}
          <div class="space-y-3 mb-4 max-h-[50vh] overflow-y-auto">
            ${repliesHTML}
          </div>
          ${replyForm}
        `;

        document.getElementById('viewThreadModal').classList.remove('hidden');
        document.getElementById('viewThreadModal').classList.add('flex');
      },

      saveReply(e, threadId) {
        e.preventDefault();
        if (!Auth.isLoggedIn()) {
          App.showToast('Please log in to post a reply.', 'error');
          App.openLoginModal();
          return;
        }

        const content = document.getElementById('replyInput').value.trim();
        if (!content) return;

        const user = Auth.getCurrentUser();
        const threads = StorageDB.get(STORAGE_KEYS.FORUMS) || [];
        const thread = threads.find(t => t.id === threadId);

        if (thread) {
          thread.replies.push({
            id: "rep-" + Date.now(),
            author: user.username,
            authorRole: user.role,
            date: new Date().toISOString().split('T')[0],
            content: content
          });

          StorageDB.set(STORAGE_KEYS.FORUMS, threads);
          StorageDB.logAction(user.username, "Reply Forum Thread", `Replied to: ${thread.title}`);
          this.viewThread(threadId);
          this.renderThreads();
          App.showToast('Reply posted!', 'success');
        }
      },

      deleteReply(threadId, replyId) {
        const currentUser = Auth.getCurrentUser();
        const isStaff = Auth.isStaff();

        const threads = StorageDB.get(STORAGE_KEYS.FORUMS) || [];
        const thread = threads.find(t => t.id === threadId);
        if (!thread) return;

        const reply = thread.replies.find(r => r.id === replyId);
        if (!reply) return;

        const isAuthor = currentUser && currentUser.username.toLowerCase() === reply.author.toLowerCase();
        if (!isStaff && !isAuthor) {
          App.showToast('Unauthorized to delete this reply.', 'error');
          return;
        }

        if (!confirm('Delete this reply?')) return;

        thread.replies = thread.replies.filter(r => r.id !== replyId);
        StorageDB.set(STORAGE_KEYS.FORUMS, threads);
        this.viewThread(threadId);
        this.renderThreads();
        App.showToast('Reply deleted.', 'info');
      },

      toggleSticky(id) {
        if (!Auth.isStaff()) return;
        const threads = StorageDB.get(STORAGE_KEYS.FORUMS) || [];
        const thread = threads.find(t => t.id === id);
        if (thread) {
          thread.isSticky = !thread.isSticky;
          StorageDB.set(STORAGE_KEYS.FORUMS, threads);
          this.viewThread(id);
          this.renderThreads();
          App.showToast('Thread sticky updated.', 'info');
        }
      },

      toggleLock(id) {
        if (!Auth.isStaff()) return;
        const threads = StorageDB.get(STORAGE_KEYS.FORUMS) || [];
        const thread = threads.find(t => t.id === id);
        if (thread) {
          thread.isLocked = !thread.isLocked;
          StorageDB.set(STORAGE_KEYS.FORUMS, threads);
          this.viewThread(id);
          this.renderThreads();
          App.showToast('Thread lock updated.', 'info');
        }
      },

      deleteThread(id) {
        const currentUser = Auth.getCurrentUser();
        const isStaff = Auth.isStaff();
        const threads = StorageDB.get(STORAGE_KEYS.FORUMS) || [];
        const thread = threads.find(t => t.id === id);
        if (!thread) return;

        const isAuthor = currentUser && currentUser.username.toLowerCase() === thread.author.toLowerCase();
        if (!isStaff && !isAuthor) {
          App.showToast('Unauthorized to delete this thread.', 'error');
          return;
        }

        if (!confirm('Delete thread permanently?')) return;
        const newThreads = threads.filter(t => t.id !== id);
        StorageDB.set(STORAGE_KEYS.FORUMS, newThreads);
        this.closeModal('viewThreadModal');
        this.renderThreads();
        App.showToast('Thread deleted.', 'info');
      }
    };

    document.addEventListener('DOMContentLoaded', () => ForumsPage.init());
  </script>
</body>
</html>
